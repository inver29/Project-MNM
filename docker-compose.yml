services:
  postgres:
    image: postgres:16-alpine
    container_name: noithat_postgres
    environment:
      POSTGRES_DB: cua_hang_noi_that_db
      POSTGRES_USER: noithat_user
      POSTGRES_PASSWORD: noithat_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noithat_user -d cua_hang_noi_that_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: noithat_backend
    environment:
      APP_TITLE: API Noi That Moc Viet
      API_V1_PREFIX: /api/v1
      SECRET_KEY: change-this-secret-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DATABASE_URL: postgresql+psycopg://noithat_user:noithat_pass@postgres:5432/cua_hang_noi_that_db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
      ADMIN_SEED_EMAIL: admin@cuahangnoithat.com
      ADMIN_SEED_PASSWORD: Admin@12345
      CUSTOMER_SEED_EMAIL: khachhang@cuahangnoithat.com
      CUSTOMER_SEED_PASSWORD: Customer@12345
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: noithat_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
